name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# actions are pinned to commit SHAs (a moved tag can't change what runs);
# Dependabot (.github/dependabot.yml) proposes updates
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python }}  # uv uses the interpreter from setup-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # the versions in uv.lock, so a run is the same as `make setup` locally
      - name: Install
        run: |
          python -m pip install -q uv
          uv sync --locked
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check .
